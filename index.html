<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c3483">
<title>Sistema V&M</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--p:#6c3483;--bg:#f0f2f5;--tx:#333;--mu:#777;--ok:#1e8e4e;--er:#d63c2f;--wa:#c96a12;--bl:#2272a6}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
.header{background:var(--p);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.header h1{font-size:20px}#net{font-size:12px}
.page{display:none;padding:16px 16px 90px}.page.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #ddd;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px;border:0;background:none;font-size:11px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn span{font-size:22px}.nav-btn.active{color:var(--p);font-weight:700}
.card,.item,.stat{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h2{font-size:16px;color:var(--p);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.stats .stat{margin:0;text-align:center}
.stat b{display:block;font-size:24px;color:var(--p)}.stat small{font-size:12px;color:var(--mu)}.wide{grid-column:1/-1}
.btn{display:block;width:100%;padding:14px 20px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn:disabled{opacity:.6}.p{background:var(--p);color:#fff}.s{background:#e6e8ec;color:var(--tx)}.g{background:var(--ok);color:#fff}.b{background:var(--bl);color:#fff}
input,select,textarea{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-bottom:12px;background:#fff;color:var(--tx);font-family:inherit}
label{font-size:14px;color:#555;margin-bottom:4px;display:block}
:focus-visible{outline:3px solid #b07cc6;outline-offset:2px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item h3{font-size:16px}.item p{font-size:13px;color:var(--mu);margin:2px 0 6px}.r{text-align:right;flex-shrink:0}
.preco{font-size:18px;font-weight:700;color:var(--p)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge.ok{background:#d5f5e3;color:var(--ok)}.badge.low{background:#fdebd0;color:var(--wa)}.badge.zero{background:#fadbd8;color:var(--er)}
.ib{padding:6px 12px;border:0;border-radius:8px;cursor:pointer;font-size:14px;margin:6px 0 0 4px}
.ib.e{background:#e4eefa}.ib.d{background:#fadbd8}.ib.k{background:#d5f5e3}
.divida{color:var(--er);font-weight:700}.sem{color:var(--ok)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #ccc;background:#fff;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--p);color:#fff;border-color:var(--p)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto}.modal.on{display:block}
.mc{background:#fff;margin:20px;border-radius:16px;padding:20px;margin-bottom:80px;max-width:520px;margin-inline:auto;width:calc(100% - 40px)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.mh h2{color:var(--p)}
.x{font-size:24px;cursor:pointer;background:none;border:0;padding:4px 8px}
.empty{text-align:center;color:var(--mu);padding:24px}.err{color:var(--er);padding:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.chk{display:flex;align-items:center;gap:8px}.chk input{width:auto;margin:0}
#v-total{font-size:20px;font-weight:700;color:var(--p);margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;padding:12px 18px;border-radius:10px;color:#fff;z-index:1000;font-size:14px;max-width:90%}
.toast.ok{background:var(--ok)}.toast.er{background:var(--er)}
#cupom-modal{background:rgba(0,0,0,.7);z-index:999}
#cupom-box{background:#fff;margin:20px auto;border-radius:16px;padding:20px;max-width:380px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
#cupom-box hr{border:0;border-top:1px dashed #aaa;margin:8px 0}.c{text-align:center}.tot{font-weight:700;font-size:15px}
@media print{body>:not(#cupom-modal){display:none!important}#cupom-modal{position:static;background:none}#cupom-box{margin:0;padding:0;max-width:none}.noprint{display:none!important}}
</style>
</head>
<body>

<header class="header"><h1>🛍️ Sistema V&amp;M</h1><span id="net">● Online</span></header>

<main>
<section id="page-dashboard" class="page active">
  <div class="stats">
    <div class="stat"><b id="s-prod">0</b><small>Produtos</small></div>
    <div class="stat"><b id="s-cli">0</b><small>Clientes</small></div>
    <div class="stat"><b id="s-vend">0</b><small>Vendas</small></div>
    <div class="stat"><b id="s-rec">R$ 0,00</b><small>A receber</small></div>
    <div class="stat wide"><b id="s-hoje">R$ 0,00</b><small>Vendido hoje</small></div>
  </div>
  <div class="card"><h2>⚡ Ações rápidas</h2>
    <button class="btn p" data-act="novaVenda">🛒 Nova venda</button>
    <button class="btn s" data-go="produtos">📦 Produtos</button>
    <button class="btn s" data-go="clientes">👥 Clientes</button>
  </div>
  <div class="card" id="c-baixo" hidden><h2>⚠️ Estoque baixo</h2><div id="l-baixo"></div></div>
</section>

<section id="page-produtos" class="page">
  <input type="search" id="busca-prod" placeholder="Buscar por nome, categoria ou código" aria-label="Buscar produto">
  <button class="btn p" data-act="novoProd">+ Novo produto</button>
  <button class="btn s" data-go="categorias">🏷️ Gerenciar categorias</button>
  <div id="l-prod"></div>
</section>

<section id="page-clientes" class="page">
  <input type="search" id="busca-cli" placeholder="Buscar cliente" aria-label="Buscar cliente">
  <button class="btn p" data-act="novoCli">+ Novo cliente</button>
  <div id="l-cli"></div>
</section>

<section id="page-vendas" class="page">
  <div class="tabs">
    <button class="tab active" data-act="filtro" data-id="todas">Todas</button>
    <button class="tab" data-act="filtro" data-id="fiado">A prazo</button>
    <button class="tab" data-act="filtro" data-id="pago">Pagas</button>
  </div>
  <div id="l-vend"></div>
</section>

<section id="page-financeiro" class="page">
  <div class="stats">
    <div class="stat"><b id="f-rec">R$ 0,00</b><small>A receber</small></div>
    <div class="stat"><b id="f-inad">0</b><small>Clientes com dívida</small></div>
  </div>
  <div class="card"><h2>💵 Contas em aberto</h2><div id="l-fin"></div></div>
</section>

<section id="page-categorias" class="page">
  <button class="btn s" data-go="produtos">← Voltar para produtos</button>
  <button class="btn p" data-act="novaCat">+ Nova categoria</button>
  <div id="l-cat"></div>
</section>
</main>

<nav class="nav">
  <button class="nav-btn active" data-go="dashboard"><span>🏠</span>Início</button>
  <button class="nav-btn" data-go="produtos"><span>📦</span>Produtos</button>
  <button class="nav-btn" data-go="clientes"><span>👥</span>Clientes</button>
  <button class="nav-btn" data-go="vendas"><span>🛒</span>Vendas</button>
  <button class="nav-btn" data-go="financeiro"><span>💰</span>Financeiro</button>
</nav>

<!-- PRODUTO (novo e edição no mesmo formulário) -->
<div id="m-prod" class="modal"><div class="mc">
  <div class="mh"><h2 id="mp-t">📦 Novo produto</h2><button class="x" data-act="close" data-id="m-prod" aria-label="Fechar">✕</button></div>
  <button class="btn b" data-act="scan" data-id="prod">📷 Ler código de barras</button>
  <div id="leitor-prod" class="leitor"></div>
  <input type="hidden" id="p-id">
  <label for="p-cod">Código de barras</label><input id="p-cod" inputmode="numeric" placeholder="Ex: 7891234567890">
  <label for="p-nome">Nome do produto</label><input id="p-nome" placeholder="Ex: Batom vermelho">
  <label for="p-cat">Categoria</label><select id="p-cat"></select>
  <label for="p-custo">Preço de custo (R$)</label><input type="number" id="p-custo" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label for="p-venda">Preço de venda (R$)</label><input type="number" id="p-venda" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label for="p-est">Estoque atual</label><input type="number" id="p-est" inputmode="numeric" min="0" placeholder="0">
  <label for="p-min">Estoque mínimo</label><input type="number" id="p-min" inputmode="numeric" min="0" placeholder="5">
  <button class="btn p" data-act="salvarProd">Salvar produto</button>
</div></div>

<!-- CLIENTE -->
<div id="m-cli" class="modal"><div class="mc">
  <div class="mh"><h2>👤 Novo cliente</h2><button class="x" data-act="close" data-id="m-cli" aria-label="Fechar">✕</button></div>
  <label for="c-nome">Nome</label><input id="c-nome" placeholder="Nome completo">
  <label for="c-wa">WhatsApp</label><input type="tel" id="c-wa" placeholder="(00) 00000-0000">
  <label for="c-obs">Observações</label><textarea id="c-obs" rows="3"></textarea>
  <button class="btn p" data-act="salvarCli">Salvar cliente</button>
</div></div>

<!-- VENDA -->
<div id="m-venda" class="modal"><div class="mc">
  <div class="mh"><h2>🛒 Nova venda</h2><button class="x" data-act="close" data-id="m-venda" aria-label="Fechar">✕</button></div>
  <button class="btn b" data-act="scan" data-id="venda">📷 Ler código de barras</button>
  <div id="leitor-venda" class="leitor"></div>
  <label for="v-cli">Cliente (opcional)</label><select id="v-cli"></select>
  <label for="v-prod">Produto</label><select id="v-prod"></select>
  <label for="v-qtd">Quantidade</label><input type="number" id="v-qtd" value="1" min="1" inputmode="numeric">
  <button class="btn s" data-act="addCart">+ Adicionar ao carrinho</button>
  <div id="carrinho"></div><div id="v-total"></div>
  <label for="v-desc">Desconto (R$)</label><input type="number" id="v-desc" value="0" min="0" step="0.01" inputmode="decimal">
  <label for="v-pag">Forma de pagamento</label>
  <select id="v-pag"><option value="dinheiro">💵 Dinheiro</option><option value="pix">📱 PIX</option><option value="debito">💳 Cartão de débito</option><option value="credito">💳 Cartão de crédito</option><option value="a prazo">🤝 A prazo</option></select>
  <label for="v-obs">Observações</label><textarea id="v-obs" rows="2"></textarea>
  <label class="chk"><input type="checkbox" id="v-imp" checked> Imprimir cupom ao finalizar</label>
  <button class="btn g" data-act="finalizar">✅ Finalizar venda</button>
</div></div>

<!-- CATEGORIA (nova e edição) -->
<div id="m-cat" class="modal"><div class="mc">
  <div class="mh"><h2 id="mc-t">🏷️ Nova categoria</h2><button class="x" data-act="close" data-id="m-cat" aria-label="Fechar">✕</button></div>
  <input type="hidden" id="k-id">
  <label for="k-nome">Nome da categoria</label><input id="k-nome" placeholder="Ex: Maquiagem">
  <button class="btn p" data-act="salvarCat">Salvar categoria</button>
</div></div>

<!-- CUPOM -->
<div id="cupom-modal" class="modal"><div id="cupom-box">
  <div class="mh noprint"><strong style="color:var(--p)">🖨️ Cupom da venda</strong><button class="x" data-act="close" data-id="cupom-modal" aria-label="Fechar">✕</button></div>
  <div id="cupom-c"></div>
  <button class="btn p noprint" style="margin-top:12px" data-act="print">🖨️ Imprimir</button>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,collection,addDoc,getDocs,doc,updateDoc,deleteDoc,increment} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db=getFirestore(initializeApp({
  apiKey:"AIzaSyBSoP60ksI_ENjkaWZa1LrONo2akJqm_zA",authDomain:"sistema-vm-8816c.firebaseapp.com",
  projectId:"sistema-vm-8816c",storageBucket:"sistema-vm-8816c.firebasestorage.app",
  messagingSenderId:"132284326777",appId:"1:132284326777:web:6a3c4fcdb84656b4ca85a8"}));

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=id=>parseFloat($(id).value)||0, int=id=>parseInt($(id).value)||0;
const when=v=>v?.seconds?new Date(v.seconds*1000):new Date();
const empty=t=>`<p class="empty">${t}</p>`;
const S={prod:[],cli:[],vend:[],cat:[],cart:[],filtro:'todas'};

function toast(t,tipo='ok'){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast '+tipo;e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}

// Senha guardada como hash (SHA-256), não em texto puro. Veja o aviso de segurança sobre as regras do Firebase.
const HASH='11646a32f4ec39e7846a6719e987404a81821ce5635f8b3a6dfb5d560ef1652f';
async function sha(s){if(!crypto.subtle)throw new Error('Abra o sistema por HTTPS (ou pelo Firebase Hosting) para usar a senha.');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function autorizar(oque){const s=prompt('Digite a senha para '+oque+':');if(s===null)return false;let h;try{h=await sha(s)}catch(e){toast(e.message,'er');return false}if(h!==HASH){toast('Senha incorreta','er');return false}return confirm('Tem certeza que quer excluir?')}

const nomeSort=(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR');
const ler=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
async function refresh(){
  try{
    const [p,c,v,k]=await Promise.all(['produtos','clientes','vendas','categorias'].map(ler));
    S.prod=p.sort(nomeSort);S.cli=c.sort(nomeSort);S.cat=k.sort(nomeSort);
    S.vend=v.sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0));
    render();
  }catch(e){toast('Erro ao carregar dados: '+e.message,'er')}
}

/* ---------- navegação ---------- */
function nav(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id==='page-'+p));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.go===p||(p==='categorias'&&b.dataset.go==='produtos')));
  scrollTo(0,0);
}

/* ---------- scanner ---------- */
let scn=null;
async function stopScan(){
  if(scn){try{await scn.stop();scn.clear()}catch{}scn=null}
  document.querySelectorAll('.leitor').forEach(e=>e.innerHTML='');
}
async function scan(ctx){
  await stopScan();
  const id='leitor-'+ctx;scn=new Html5Qrcode(id);
  try{
    await scn.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},async cod=>{await stopScan();onCode(ctx,cod)},()=>{});
  }catch{scn=null;$(id).innerHTML='<p class="err">Não foi possível abrir a câmera. Permita o acesso e tente de novo.</p>'}
}
function onCode(ctx,cod){
  if(ctx==='prod'){$('p-cod').value=cod;toast('Código lido: '+cod);return}
  const p=S.prod.find(x=>x.codigo===cod);
  if(!p)return toast('Produto não encontrado. Cadastre-o primeiro.','er');
  $('v-prod').value=p.id;addCart(p.id,1);
}

/* ---------- renderização ---------- */
function render(){stats();rProd();rCli();rVend();rFin();rCat()}

function stats(){
  const rec=S.cli.reduce((s,c)=>s+(c.divida||0),0),hoje=new Date().toDateString();
  $('s-prod').textContent=S.prod.length;$('s-cli').textContent=S.cli.length;$('s-vend').textContent=S.vend.length;
  $('s-rec').textContent=R(rec);
  $('s-hoje').textContent=R(S.vend.filter(v=>when(v.criadoEm).toDateString()===hoje).reduce((s,v)=>s+(v.total||0),0));
  const baixo=S.prod.filter(p=>p.estoque<=(p.estoqueMin??5));
  $('c-baixo').hidden=!baixo.length;
  $('l-baixo').innerHTML=baixo.map(p=>`<div class="row"><span>${esc(p.nome)}</span><span class="badge low">${p.estoque} un</span></div>`).join('');
}

const nivel=p=>p.estoque<=0?['zero','Sem estoque']:p.estoque<=(p.estoqueMin??5)?['low','Estoque baixo']:['ok','Em estoque'];
function rProd(){
  const q=$('busca-prod').value.toLowerCase();
  const l=S.prod.filter(p=>[p.nome,p.categoria,p.codigo].some(v=>String(v||'').toLowerCase().includes(q)));
  $('l-prod').innerHTML=l.length?l.map(p=>{const [b,t]=nivel(p);return `<div class="item"><div><h3>${esc(p.nome)}</h3><p>${esc(p.categoria||'Sem categoria')}${p.codigo?' • '+esc(p.codigo):''}</p><span class="badge ${b}">${t}: ${p.estoque}</span></div><div class="r"><div class="preco">${R(p.venda)}</div><button class="ib e" data-act="editProd" data-id="${p.id}" aria-label="Editar ${esc(p.nome)}">✏️</button><button class="ib d" data-act="delProd" data-id="${p.id}" aria-label="Excluir ${esc(p.nome)}">🗑️</button></div></div>`}).join(''):empty(q?'Nenhum produto encontrado':'Nenhum produto cadastrado. Toque em “Novo produto” para começar.');
}

function rCli(){
  const q=$('busca-cli').value.toLowerCase();
  const l=S.cli.filter(c=>String(c.nome||'').toLowerCase().includes(q));
  $('l-cli').innerHTML=l.length?l.map(c=>`<div class="item"><div><h3>${esc(c.nome)}</h3><p>${esc(c.whatsapp||'Sem WhatsApp')}</p>${c.divida>0?`<span class="divida">Deve: ${R(c.divida)}</span>`:'<span class="sem">Sem dívidas</span>'}</div><div class="r">${c.whatsapp?`<a class="ib k" style="text-decoration:none;display:inline-block" href="https://wa.me/55${String(c.whatsapp).replace(/\D/g,'')}" target="_blank" rel="noopener" aria-label="Abrir WhatsApp">📱</a>`:''}<button class="ib d" data-act="delCli" data-id="${c.id}" aria-label="Excluir ${esc(c.nome)}">🗑️</button></div></div>`).join(''):empty(q?'Nenhum cliente encontrado':'Nenhum cliente cadastrado');
}

function rVend(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===S.filtro));
  const l=S.vend.filter(v=>S.filtro==='fiado'?v.pagamento==='a prazo':S.filtro==='pago'?v.status==='pago':true);
  $('l-vend').innerHTML=l.length?l.map(v=>`<div class="item"><div><strong>${esc(v.clienteNome)}</strong><p>${when(v.criadoEm).toLocaleDateString('pt-BR')} • ${esc(v.pagamento)}</p></div><div class="r"><strong style="color:var(--p)">${R(v.total)}</strong><br><span class="badge ${v.status==='pago'?'ok':'low'}">${v.status==='pago'?'Pago':'Pendente'}</span><br><button class="ib e" data-act="cupom" data-id="${v.id}">🖨️ Reimprimir</button></div></div>`).join(''):empty('Nenhuma venda registrada');
}

function rFin(){
  const l=S.cli.filter(c=>c.divida>0);
  $('f-rec').textContent=R(l.reduce((s,c)=>s+c.divida,0));$('f-inad').textContent=l.length;
  $('l-fin').innerHTML=l.length?l.map(c=>`<div class="row" style="align-items:center;padding:12px 0;border-bottom:1px solid #eee"><div><strong>${esc(c.nome)}</strong>${c.whatsapp?`<br><small>${esc(c.whatsapp)}</small>`:''}</div><div class="r"><div class="divida">${R(c.divida)}</div><button class="ib k" data-act="pagar" data-id="${c.id}">💰 Receber</button></div></div>`).join(''):'<p class="empty sem">✅ Nenhuma conta em aberto</p>';
}

function rCat(){
  $('l-cat').innerHTML=S.cat.length?S.cat.map(c=>`<div class="item"><strong>${esc(c.nome)}</strong><div><button class="ib e" data-act="editCat" data-id="${c.id}" aria-label="Editar">✏️</button><button class="ib d" data-act="delCat" data-id="${c.id}" aria-label="Excluir">🗑️</button></div></div>`).join(''):empty('Nenhuma categoria cadastrada');
}

const opts=(l,ph,val,txt)=>`<option value="">${ph}</option>`+l.map(x=>`<option value="${esc(val(x))}">${esc(txt(x))}</option>`).join('');

/* ---------- carrinho e cupom ---------- */
function rCart(){
  const sub=S.cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const d=Math.min(Math.max(num('v-desc'),0),sub);
  $('carrinho').innerHTML=S.cart.length?'<div style="background:#f6f6f8;border-radius:10px;padding:12px;margin-bottom:8px">'+S.cart.map((i,x)=>`<div class="row"><span>${esc(i.nome)} x${i.qtd}</span><span>${R(i.preco*i.qtd)} <button class="ib d" style="margin:0" data-act="rmCart" data-id="${x}" aria-label="Remover">✕</button></span></div>`).join('')+'</div>':'';
  $('v-total').textContent=S.cart.length?'Total: '+R(sub-d):'';
  return {sub,d,total:sub-d};
}
function addCart(id,q){
  const p=S.prod.find(x=>x.id===id);
  if(!p)return toast('Selecione um produto','er');
  const it=S.cart.find(i=>i.id===id),tot=(it?.qtd||0)+q;
  if(tot>p.estoque)return toast(`Estoque insuficiente (${p.estoque} un)`,'er');
  if(it)it.qtd=tot;else S.cart.push({id,nome:p.nome,preco:p.venda||0,qtd:q});
  rCart();toast('Adicionado: '+p.nome);
}
function cupom(v){
  $('cupom-c').innerHTML=`<div class="c"><b>🛍️ Sistema V&amp;M</b><br><small>${when(v.criadoEm).toLocaleString('pt-BR')}</small><br><small>Cliente: ${esc(v.clienteNome)}</small></div><hr>${(v.itens||[]).map(i=>`<div class="row"><span>${esc(i.nome)} x${i.qtd}</span><span>${R(i.preco*i.qtd)}</span></div>`).join('')}<hr>${v.desconto>0?`<div class="row"><span>Subtotal:</span><span>${R(v.subtotal)}</span></div><div class="row"><span>Desconto:</span><span>- ${R(v.desconto)}</span></div>`:''}<div class="row tot"><span>TOTAL:</span><span>${R(v.total)}</span></div><small>Pagamento: ${esc(v.pagamento)}</small><hr><div class="c"><small>Obrigada pela preferência! ❤️</small></div>`;
  $('cupom-modal').classList.add('on');
}

/* ---------- ações ---------- */
const A={
  open:id=>$(id).classList.add('on'),
  close:async id=>{await stopScan();$(id).classList.remove('on')},
  scan:(ctx)=>scan(ctx),
  print:()=>window.print(),

  novoProd:()=>{
    ['p-id','p-cod','p-nome','p-custo','p-venda','p-est','p-min'].forEach(i=>$(i).value='');
    $('mp-t').textContent='📦 Novo produto';$('p-cat').innerHTML=opts(S.cat,'Selecionar categoria...',c=>c.nome,c=>c.nome);A.open('m-prod');
  },
  editProd:id=>{
    const p=S.prod.find(x=>x.id===id);if(!p)return;
    $('p-id').value=p.id;$('p-cod').value=p.codigo||'';$('p-nome').value=p.nome||'';$('p-custo').value=p.custo||'';
    $('p-venda').value=p.venda||'';$('p-est').value=p.estoque??'';$('p-min').value=p.estoqueMin??'';
    const cats=S.cat.some(c=>c.nome===p.categoria)||!p.categoria?S.cat:[...S.cat,{nome:p.categoria}];
    $('p-cat').innerHTML=opts(cats,'Selecionar categoria...',c=>c.nome,c=>c.nome);$('p-cat').value=p.categoria||'';
    $('mp-t').textContent='✏️ Editar produto';A.open('m-prod');
  },
  salvarProd:async(_,btn)=>{
    const nome=$('p-nome').value.trim(),id=$('p-id').value,codigo=$('p-cod').value.trim();
    if(!nome)return toast('Digite o nome do produto','er');
    if(codigo&&S.prod.some(p=>p.codigo===codigo&&p.id!==id))return toast('Já existe um produto com esse código','er');
    const d={nome,codigo,categoria:$('p-cat').value,custo:num('p-custo'),venda:num('p-venda'),estoque:int('p-est'),estoqueMin:$('p-min').value===''?5:int('p-min')};
    btn.disabled=true;
    try{
      if(id)await updateDoc(doc(db,'produtos',id),d);else await addDoc(collection(db,'produtos'),{...d,criadoEm:new Date()});
      toast(id?'Produto atualizado':'Produto salvo');await A.close('m-prod');await refresh();
    }catch(e){toast('Erro: '+e.message,'er')}finally{btn.disabled=false}
  },
  delProd:async id=>{if(!await autorizar('excluir o produto'))return;await deleteDoc(doc(db,'produtos',id));toast('Produto excluído');refresh()},

  novoCli:()=>{['c-nome','c-wa','c-obs'].forEach(i=>$(i).value='');A.open('m-cli')},
  salvarCli:async(_,btn)=>{
    const nome=$('c-nome').value.trim();if(!nome)return toast('Digite o nome do cliente','er');
    btn.disabled=true;
    try{await addDoc(collection(db,'clientes'),{nome,whatsapp:$('c-wa').value.trim(),obs:$('c-obs').value.trim(),divida:0,totalComprado:0,criadoEm:new Date()});
      toast('Cliente salvo');await A.close('m-cli');await refresh();
    }catch(e){toast('Erro: '+e.message,'er')}finally{btn.disabled=false}
  },
  delCli:async id=>{if(!await autorizar('excluir o cliente'))return;await deleteDoc(doc(db,'clientes',id));toast('Cliente excluído');refresh()},

  novaCat:()=>{$('k-id').value='';$('k-nome').value='';$('mc-t').textContent='🏷️ Nova categoria';A.open('m-cat')},
  editCat:id=>{const c=S.cat.find(x=>x.id===id);if(!c)return;$('k-id').value=id;$('k-nome').value=c.nome;$('mc-t').textContent='✏️ Editar categoria';A.open('m-cat')},
  salvarCat:async(_,btn)=>{
    const nome=$('k-nome').value.trim(),id=$('k-id').value;if(!nome)return toast('Digite o nome da categoria','er');
    btn.disabled=true;
    try{if(id)await updateDoc(doc(db,'categorias',id),{nome});else await addDoc(collection(db,'categorias'),{nome,criadoEm:new Date()});
      toast('Categoria salva');await A.close('m-cat');await refresh();
    }catch(e){toast('Erro: '+e.message,'er')}finally{btn.disabled=false}
  },
  delCat:async id=>{if(!await autorizar('excluir a categoria'))return;await deleteDoc(doc(db,'categorias',id));toast('Categoria excluída');refresh()},

  novaVenda:()=>{
    S.cart=[];$('v-desc').value=0;$('v-obs').value='';$('v-qtd').value=1;
    $('v-cli').innerHTML=opts(S.cli,'Consumidor (sem cadastro)',c=>c.id,c=>c.nome);
    $('v-prod').innerHTML=opts(S.prod.filter(p=>p.estoque>0),'Selecionar produto...',p=>p.id,p=>`${p.nome} - ${R(p.venda)}`);
    rCart();A.open('m-venda');
  },
  addCart:()=>addCart($('v-prod').value,Math.max(int('v-qtd'),1)),
  rmCart:x=>{S.cart.splice(+x,1);rCart()},
  finalizar:async(_,btn)=>{
    if(!S.cart.length)return toast('Adicione produtos ao carrinho','er');
    const cid=$('v-cli').value,pg=$('v-pag').value;
    if(pg==='a prazo'&&!cid)return toast('Selecione o cliente para vender a prazo','er');
    const {sub,d,total}=rCart(),cli=S.cli.find(c=>c.id===cid);
    btn.disabled=true;
    try{
      const v={clienteId:cid,clienteNome:cli?.nome||'Consumidor',itens:S.cart.map(({id,nome,preco,qtd})=>({id,nome,preco,qtd})),subtotal:sub,desconto:d,total,pagamento:pg,obs:$('v-obs').value.trim(),status:pg==='a prazo'?'pendente':'pago',criadoEm:new Date()};
      await addDoc(collection(db,'vendas'),v);
      // increment() faz o ajuste direto no servidor, sem sobrescrever vendas feitas em outro aparelho
      await Promise.all([
        ...v.itens.map(i=>updateDoc(doc(db,'produtos',i.id),{estoque:increment(-i.qtd)})),
        ...(cli?[updateDoc(doc(db,'clientes',cid),{totalComprado:increment(total),...(pg==='a prazo'?{divida:increment(total)}:{})})]:[])
      ]);
      const imprimir=$('v-imp').checked;S.cart=[];await A.close('m-venda');await refresh();
      toast('Venda finalizada');if(imprimir)cupom(v);
    }catch(e){toast('Erro ao finalizar: '+e.message,'er')}finally{btn.disabled=false}
  },
  filtro:t=>{S.filtro=t;rVend()},
  cupom:id=>{const v=S.vend.find(x=>x.id===id);if(v)cupom(v)},

  pagar:async id=>{
    const c=S.cli.find(x=>x.id===id);if(!c)return;
    const txt=prompt(`Receber pagamento de ${c.nome}\nDívida: ${R(c.divida)}\n\nValor recebido:`);if(txt===null)return;
    const valor=parseFloat(txt.replace(',','.'));
    if(!(valor>0))return toast('Valor inválido','er');
    if(valor>c.divida+0.001)return toast('O valor é maior que a dívida','er');
    try{
      await updateDoc(doc(db,'clientes',id),{divida:increment(-valor)});
      await addDoc(collection(db,'pagamentos'),{clienteId:id,nome:c.nome,valor,criadoEm:new Date()});
      toast('Pagamento de '+R(valor)+' registrado');refresh();
    }catch(e){toast('Erro: '+e.message,'er')}
  }
};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act]');
  if(t){if(t.dataset.go)nav(t.dataset.go);else A[t.dataset.act]?.(t.dataset.id,t);return}
  if(e.target.classList.contains('modal')&&e.target.id!=='cupom-modal')A.close(e.target.id);
});
document.addEventListener('input',e=>{
  if(e.target.id==='busca-prod')rProd();
  if(e.target.id==='busca-cli')rCli();
  if(e.target.id==='v-desc')rCart();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.on').forEach(m=>A.close(m.id))});
const net=()=>{const o=navigator.onLine;$('net').textContent=o?'● Online':'● Offline';$('net').style.color=o?'#fff':'#ffd2cc'};
addEventListener('online',net);addEventListener('offline',net);net();

refresh();
</script>
</body>
</html>
